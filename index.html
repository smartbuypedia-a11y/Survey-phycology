<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>
<style>
body { margin:0; font-family: Arial; overflow:hidden; }

/* ── Infinite zoom layers (start screen only) ── */
.zoom-wrap {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}
.zoom-layer {
  position: absolute;
  inset: -20%;
  width: 140%;
  height: 140%;
  background-size: cover;
  background-position: center;
  transform-origin: center center;
  will-change: transform, opacity;
}
.zoom-layer:nth-child(1) { animation: zoomIn 9s linear infinite 0s; }
.zoom-layer:nth-child(2) { animation: zoomIn 9s linear infinite 4.5s; }

@keyframes zoomIn {
  0%   { transform: scale(1);   opacity: 1; }
  95%  { transform: scale(2.4); opacity: 1; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ── Static bg for survey questions ── */
.bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.5s;
  z-index: 0;
  opacity: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

h2 { margin-bottom: 20px; }

button {
  width: 100%;
  max-width: 420px;
  margin: 8px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: white;
  font-weight: bold;
  cursor: pointer;
}

.progress {
  position: fixed;
  top: 0; left: 0;
  height: 5px;
  background: #00ffcc;
  width: 0%;
}

.info-input {
  width: 100%;
  max-width: 380px;
  margin: 8px 0;
  padding: 13px;
  border-radius: 10px;
  border: none;
}

.gender-row {
  display: flex;
  gap: 10px;
}
.gender-btn.selected {
  background: #00ffcc;
  color: black;
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<div class="zoom-wrap" id="zoomWrap">
  <div class="zoom-layer" id="zl1"></div>
  <div class="zoom-layer" id="zl2"></div>
</div>

<div class="bg" id="bg"></div>
<div class="overlay"></div>

<div class="container" id="startScreen">
  <h2>Start Survey</h2>
  <button onclick="startSurvey()">Start</button>
</div>

<div class="container" id="infoScreen" style="display:none;">
  <input id="nicknameInput" class="info-input" placeholder="Name">
  <input id="cityInput" class="info-input" placeholder="City">
  <div class="gender-row">
    <button id="genderMale" onclick="selectGender('Male')">Male</button>
    <button id="genderFemale" onclick="selectGender('Female')">Female</button>
  </div>
  <button onclick="submitInfo()">Next</button>
</div>

<div class="container" id="surveyScreen" style="display:none;">
  <h2 id="q"></h2>
  <div id="opts"></div>
</div>

<script>

let survey = [
  { q:"Q1?", bg:"", options:[{label:"A",score:1},{label:"B",score:2}] },
  { q:"Q2?", bg:"", options:[{label:"A",score:1},{label:"B",score:2}] }
];

let i=0, totalScore=0, answers=[];
let userNickname="", userCity="", userGender="";

function selectGender(g){
  userGender=g;
}

function submitInfo(){
  userNickname=document.getElementById("nicknameInput").value;
  userCity=document.getElementById("cityInput").value;
  document.getElementById("infoScreen").style.display="none";
  document.getElementById("surveyScreen").style.display="flex";
  loadQ();
}

function startSurvey(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("infoScreen").style.display="flex";
}

function loadQ(){
  let d=survey[i];
  document.getElementById("q").innerText=d.q;
  document.getElementById("opts").innerHTML=
    d.options.map(o=>`<button onclick="next(${o.score}, \`${o.label}\`)">${o.label}</button>`).join("");
}

function next(score,label){

  answers.push(label);
  totalScore += score;

  i++;

  if(i >= survey.length){
    showResult();
    return;
  }

  loadQ();
}

function showResult(){

  document.getElementById("surveyScreen").innerHTML = `
    <h2>Done</h2>
    <p>Score: ${totalScore}</p>
  `;

  sendToSheet();
}

function sendToSheet(){

fetch("https://script.google.com/macros/s/AKfycbwpyZzSc6-Ob6ka_QVfxyxNuKWdaFLsyxeDf1CpzLkQtOiUl-u4H-bj-wth2hz16NxF/exec", {
  method:"POST",
  body: JSON.stringify({
    name: userNickname,
    city: userCity,
    gender: userGender,
    score: totalScore,
    answers: answers.join(" | ")
  })
});

}

</script>
</body>
</html>
