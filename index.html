<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>
<style>
body { margin:0; font-family: Arial; overflow:hidden; }

/* ── Infinite zoom layers (start screen only) ── */
.zoom-wrap {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
}
.zoom-layer {
  position: absolute;
  inset: -20%;
  width: 140%;
  height: 140%;
  background-size: cover;
  background-position: center;
  transform-origin: center center;
  will-change: transform, opacity;
}
.zoom-layer:nth-child(1) { animation: zoomIn 9s linear infinite 0s; }
.zoom-layer:nth-child(2) { animation: zoomIn 9s linear infinite 4.5s; }

@keyframes zoomIn {
  0%   { transform: scale(1);   opacity: 1; }
  95%  { transform: scale(2.4); opacity: 1; }
  100% { transform: scale(2.4); opacity: 0; }
}

/* ── Static bg for survey questions ── */
.bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.5s;
  z-index: 0;
  opacity: 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

h2 { margin-bottom: 20px; }

button {
  width: 100%;
  max-width: 420px;
  margin: 8px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: white;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
button:hover  { background: #f0f0f0; }
button:active { transform: scale(0.97); }

.progress {
  position: fixed;
  top: 0; left: 0;
  height: 5px;
  background: #00ffcc;
  width: 0%;
  transition: width 0.3s;
  z-index: 10;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── Info screen inputs ── */
.info-input {
  width: 100%;
  max-width: 380px;
  margin: 8px 0;
  padding: 13px 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 0.95rem;
  outline: none;
  box-sizing: border-box;
  backdrop-filter: blur(4px);
  transition: border 0.2s;
}
.info-input::placeholder { color: rgba(255,255,255,0.5); }
.info-input:focus { border-color: #00ffcc; }

.gender-row {
  display: flex;
  gap: 10px;
  max-width: 380px;
  width: 100%;
  margin: 8px 0;
}
.gender-btn {
  flex: 1;
  padding: 12px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.gender-btn.selected {
  background: #00ffcc;
  color: #000;
  border-color: #00ffcc;
}
.info-error {
  color: #ff6b6b;
  font-size: 0.82rem;
  margin: 4px 0 0;
  display: none;
}
</style>

<body>

  <div class="zoom-layer" id="zl2"></div>
</div>

<!-- Static background (survey questions) -->
<div class="bg" id="bg"></div>

<div class="overlay"></div>

    Unga style ku<br>oru name irukkum!<br>
    <span style="font-size:1.05rem; opacity:0.85; font-weight:normal;">Neenga enna type nu theriyuma?</span>
  </h2>

  <p style="font-size:0.93rem; line-height:1.9; max-width:360px; opacity:0.88;">

    ⏱ 30 seconds &nbsp;|&nbsp; No sign up &nbsp;|&nbsp; No data collected
  </p>

  <button onclick="startSurvey()" style="background:#00ffcc; color:#000; font-size:1rem; letter-spacing:0.5px; box-shadow:0 4px 24px rgba(0,255,204,0.45);">
    What's My Type? 👀🔥
  </button>
</div>

<!-- INFO SCREEN -->
<div class="container" id="infoScreen" style="display:none;">
  <h2 style="font-size:1.3rem; line-height:1.7; margin-bottom:6px; text-shadow:0 2px 12px rgba(0,0,0,0.6);">
    Konjam unga pathi sollunga 👇
  </h2>
  <p style="font-size:0.85rem; opacity:0.7; margin: 0 0 16px;">Takes 10 seconds — promise!</p>

  <input class="info-input" id="nicknameInput" type="text" placeholder="Unga nickname (e.g. Ravi, Priya...)" maxlength="30" />

  <input class="info-input" id="cityInput" type="text" placeholder="Unga city (e.g. Salem, Chennai...)" maxlength="40" />

  <div class="gender-row">
    <button class="gender-btn" id="genderMale"   onclick="selectGender('Male')"  >Male</button>
    <button class="gender-btn" id="genderFemale" onclick="selectGender('Female')">Female</button>
    <button class="gender-btn" id="genderOther"  onclick="selectGender('Other')" >Other</button>
  </div>

  <p class="info-error" id="infoError">Please fill all fields and select gender</p>

  <button onclick="submitInfo()" style="background:#00ffcc; color:#000; font-size:1rem; max-width:380px; margin-top:10px; box-shadow:0 4px 24px rgba(0,255,204,0.45);">
    Let's Go!
  </button>
</div>

<div class="container" id="surveyScreen" style="display:none;">

let i = 0;
let answers = [];
let totalScore = 0;
let userNickname = "";
let userCity = "";
let userGender = "";

function selectGender(g) {
  userGender = g;
  ["Male","Female","Other"].forEach(function(x) {
    document.getElementById("gender" + x).classList.toggle("selected", x === g);
  });
}

function submitInfo() {
  var nick = document.getElementById("nicknameInput").value.trim();
  var city = document.getElementById("cityInput").value.trim();
  var err  = document.getElementById("infoError");
  if (!nick || !city || !userGender) {
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  userNickname = nick;
  userCity = city;
  document.getElementById("infoScreen").style.display = "none";
  document.getElementById("surveyScreen").style.display = "flex";
  document.getElementById("bg").style.opacity = "1";
  loadQ();
}

function getPersonality(score) {
  return personalities.find(p => score >= p.min && score <= p.max) || personalities[0];
}

function showResult() {
  const p = getPersonality(totalScore);
  sendToSheet(p);
  document.getElementById("progress").style.width = "100%";
  document.getElementById("zoomWrap").style.display = "none";
  document.getElementById("bg").style.opacity = "0.25";

  document.getElementById("surveyScreen").innerHTML = `
    <div style="max-width:420px; padding:10px; animation: fadeUp 0.6s ease;">
      <div style="font-size:3.5rem; margin-bottom:8px;">${p.emoji}</div>
      <h2 style="color:${p.color}; margin:10px 0; font-size:1.5rem; text-shadow:0 0 24px ${p.color}66;">${p.type}</h2>
      <p style="font-size:1rem; font-weight:bold; margin-bottom:10px;">${p.tamil}</p>
      <p style="font-size:0.9rem; line-height:1.8; opacity:0.9; max-width:360px;">${p.desc}</p>
      <div style="margin-top:22px; padding:14px; background:rgba(255,255,255,0.1); border-radius:14px; backdrop-filter:blur(6px);">
        <p style="margin:0; font-size:0.75rem; opacity:0.65; letter-spacing:1.5px; text-transform:uppercase;">Unga Style Score</p>
        <p style="margin:6px 0 0; font-size:2.2rem; font-weight:bold; color:${p.color};">${totalScore} <span style="font-size:1rem; opacity:0.55;">/ 63</span></p>
      </div>
    </div>
  `;

  fetch("https://script.google.com/macros/s/AKfycbx2pOf7BX_ExhQNRh2zAc6KlARMcnHJT4X7PwaCSXxAxvc5VORpGRlYFRugkEwPjvoNsw/exec", {
    method: "POST",
    body: JSON.stringify({
      nickname: userNickname,
      city: userCity,
      gender: userGender,
      score: totalScore,
      type: p.type,
      answers: answers.join(" | ")
    })
  });
}

function preload(url) { new Image().src = url; }

function setBg(url) {
  const bg = document.getElementById("bg");
  const img = new Image();
  img.onload = () => { bg.style.backgroundImage = `url(${url})`; };
  img.src = url;
}

function startSurvey() {
  document.getElementById("zoomWrap").style.display = "none";
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("infoScreen").style.display = "flex";
  document.getElementById("bg").style.opacity = "1";
}

function loadQ() {
  const d = survey[i];
  document.getElementById("q").innerText = d.q;
  setBg(d.bg);
  if (survey[i + 1]) preload(survey[i + 1].bg);
  document.getElementById("progress").style.width = (i / survey.length * 100) + "%";
  document.getElementById("opts").innerHTML = d.options
    .map(o => `<button onclick="next(${o.score}, \`${o.label}\`)">${o.label}</button>`)
    .join("");
}

function next(score, label) {
  answers.push(label);
  totalScore += score;
  document.getElementById("bg").style.opacity = 0;
  setTimeout(() => {
    i++;
    if (i < survey.length) {
      loadQ();
      document.getElementById("bg").style.opacity = 1;
    } else {
      showResult();
    }
  }, 300);
}

preload(survey[0].bg);
